apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hooklane-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hooklane
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hooklane-worker
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hooklane
      app.kubernetes.io/component: worker

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hooklane_test
          POSTGRES_USER: hooklane
          POSTGRES_PASSWORD: ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hooklane -d hooklane_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HOOKLANE_TEST_DATABASE_URL: postgres://hooklane:ci_only@localhost:5432/hooklane_test?sslmode=disable
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      # Applies the embedded migrations the same way production does.
      - run: DATABASE_URL="$HOOKLANE_TEST_DATABASE_URL" go run ./cmd/admin migrate up
      - run: go test -race ./...
      - run: go build ./cmd/...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/receiver-go/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: cd examples/receiver-go && go vet ./... && go test ./...
      - run: node --test examples/receiver-node/

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg VERSION=ci -t hooklane:ci .
      - run: docker run --rm hooklane:ci hooklane-admin version

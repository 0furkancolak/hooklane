apiVersion: v1
kind: ConfigMap
metadata:
  name: hooklane-config
data:
  APP_ENV: "production"
  RETENTION_PERIOD: "720h"
  # The API limits per client address, and behind an ingress every request
  # comes from the ingress pod, so the limit is off here. Rate limit at the
  # ingress instead (see ingress.yaml). Set a number to limit per pod.
  RATE_LIMIT_RPS: "0"
  RATE_LIMIT_BURST: "200"
  WORKER_CONCURRENCY: "10"
  WORKER_REQUEST_TIMEOUT: "15s"
  # terminationGracePeriodSeconds in worker-deployment.yaml must stay at least
  # 10 seconds above this value.
  WORKER_SHUTDOWN_TIMEOUT: "20s"
  WORKER_MAX_ATTEMPTS: "10"

# Scales the API on CPU. Needs metrics-server. Workers are not autoscaled here:
# size them from hooklane_queue_oldest_due_seconds (see docs/deployment.md).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hooklane-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hooklane-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300

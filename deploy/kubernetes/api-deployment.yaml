apiVersion: apps/v1
kind: Deployment
metadata:
  name: hooklane-api
  labels:
    app.kubernetes.io/name: hooklane
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hooklane
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hooklane
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: hooklane
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: ghcr.io/0furkancolak/hooklane:latest
          args: ["hooklane-api"]
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9101
          env:
            - name: PORT
              value: "8080"
            - name: METRICS_ADDR
              value: "0.0.0.0:9101"
          envFrom:
            - configMapRef:
                name: hooklane-config
            - secretRef:
                name: hooklane-secrets
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: "1", memory: 256Mi }

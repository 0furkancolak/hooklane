# Template only; it is not part of kustomization.yaml. Prefer creating the
# Secret without writing values to disk:
#
#   kubectl -n hooklane create secret generic hooklane-secrets \
#     --from-literal=DATABASE_URL='postgres://USER:PASSWORD@HOST:5432/hooklane?sslmode=require' \
#     --from-literal=ENDPOINT_SECRET_KEY="$(openssl rand -base64 32)"
#
# or fill the placeholders below and manage the Secret with your secret
# tooling (External Secrets, Sealed Secrets, SOPS, ...). Back up
# ENDPOINT_SECRET_KEY: without it stored endpoint secrets cannot be decrypted,
# and changing it breaks deliveries to every existing endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: hooklane-secrets
  namespace: hooklane
type: Opaque
stringData:
  DATABASE_URL: "postgres://REPLACE_USER:REPLACE_PASSWORD@REPLACE_HOST:5432/hooklane?sslmode=require"
  ENDPOINT_SECRET_KEY: "REPLACE_WITH_BASE64_OF_32_RANDOM_BYTES"
